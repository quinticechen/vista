
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Every page-level meta tag below this point (title, description, keywords,
         author, Open Graph, Twitter Card, robots, theme-color, canonical) is set
         dynamically per-route by <SEOHead> (src/components/SEOHead.tsx) via
         react-helmet-async. They used to also be hardcoded here with generic "Vista
         Content Platform" copy and a canonical pointing at the site root -- since
         react-helmet-async only replaces the single <title> element and otherwise
         APPENDS new <meta>/<link> tags rather than removing pre-existing static ones,
         every route ended up with duplicate description/og/twitter/canonical tags,
         and tools that read the first match saw this generic static content instead
         of the real per-page (or per-article) title/description/image. Do not
         re-add per-page SEO tags here -- add/adjust them in SEOHead.tsx or the
         page's own SEOHead usage instead. -->
    <title>Vista Content Platform</title>
    <link rel="icon" href="/public/og-image.png" type="image/png" />
    <link rel="apple-touch-icon" href="/public/og-image.png">

    <!-- API keys are now managed through Supabase secrets -->
  </head>

  <body>
    <div id="root"></div>
    
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
